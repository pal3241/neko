<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naiko</title>
<style>
  /* ── reset ── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* ── palette ── */
  :root {
    --bg:        #0d0d0f;
    --surface:   #141417;
    --border:    #1f1f25;
    --muted:     #2a2a32;
    --accent:    #7c6af7;
    --accent-hi: #9d8fff;
    --text:      #e2e2e8;
    --text-dim:  #6b6b80;
    --ok:        #4ade80;
    --warn:      #facc15;
    --err:       #f87171;
    --status-dot:#3b3b47;
    --radius:    6px;
  }

  html, body { height: 100%; background: var(--bg); color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px;
    overflow: hidden; user-select: none; }

  /* ── titlebar ── */
  #titlebar {
    display: flex; align-items: center; justify-content: space-between;
    height: 36px; padding: 0 12px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    -webkit-app-region: drag;
  }
  #titlebar .left  { display: flex; align-items: center; gap: 8px; }
  #titlebar .title { font-size: 13px; font-weight: 600; letter-spacing: .03em;
    color: var(--accent-hi); }
  #titlebar .version { font-size: 11px; color: var(--text-dim); }
  #titlebar .controls { display: flex; gap: 4px; -webkit-app-region: no-drag; }
  .ctrl-btn {
    width: 26px; height: 22px; border: none; border-radius: var(--radius);
    background: transparent; color: var(--text-dim); font-size: 13px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: background .15s, color .15s;
  }
  .ctrl-btn:hover { background: var(--muted); color: var(--text); }
  .ctrl-btn.close:hover { background: #c0392b; color: #fff; }

  /* ── status bar ── */
  #statusbar {
    display: flex; align-items: center; gap: 8px;
    padding: 0 14px; height: 28px;
    background: var(--surface); border-bottom: 1px solid var(--border);
    font-size: 11px;
  }
  #status-dot { width: 7px; height: 7px; border-radius: 50%;
    background: var(--status-dot); transition: background .3s; }
  #status-dot.ready        { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
  #status-dot.connecting   { background: var(--warn); }
  #status-dot.disconnected { background: var(--err); }
  #status-text { color: var(--text-dim); }
  .spacer { flex: 1; }
  #roblox-ver { color: var(--text-dim); }

  /* ── layout ── */
  #app { display: flex; height: calc(100vh - 64px); }

  /* ── sidebar ── */
  #sidebar {
    width: 180px; min-width: 180px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
  }
  .nav-item {
    display: flex; align-items: center; gap: 9px;
    padding: 10px 14px; font-size: 12.5px; color: var(--text-dim);
    cursor: pointer; border-left: 2px solid transparent;
    transition: color .15s, background .15s, border-color .15s;
  }
  .nav-item:hover  { color: var(--text); background: var(--muted); }
  .nav-item.active { color: var(--accent-hi); border-left-color: var(--accent);
    background: rgba(124,106,247,.08); }
  .nav-icon { font-size: 14px; width: 16px; text-align: center; }
  .nav-sep { height: 1px; background: var(--border); margin: 6px 0; }
  .sidebar-bottom { margin-top: auto; }

  /* ── main content ── */
  #content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  /* ── panels ── */
  .panel { display: none; flex: 1; flex-direction: column; overflow: hidden; }
  .panel.active { display: flex; }

  /* ── editor panel ── */
  #editor-panel { flex-direction: row; }
  #editor-wrap  { flex: 1; position: relative; }
  #monaco-container { position: absolute; inset: 0; }

  /* ── editor bottom bar ── */
  #editor-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 10px;
    background: var(--surface); border-top: 1px solid var(--border);
  }
  .btn {
    padding: 5px 14px; border-radius: var(--radius); border: none;
    font-size: 12px; font-weight: 600; cursor: pointer;
    transition: opacity .15s, transform .1s;
  }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { opacity: .88; }
  .btn-ghost { background: var(--muted); color: var(--text); }
  .btn-ghost:hover { opacity: .8; }
  .btn-danger { background: #3d1a1a; color: var(--err); }
  .btn-danger:hover { opacity: .8; }
  .editor-bar-right { margin-left: auto; display: flex; gap: 6px; }

  /* ── console panel ── */
  #console-panel { background: var(--bg); }
  #console-out {
    flex: 1; overflow-y: auto; padding: 10px 14px;
    font-family: 'Cascadia Code', 'Consolas', monospace; font-size: 12px;
    line-height: 1.6;
  }
  #console-out::-webkit-scrollbar { width: 5px; }
  #console-out::-webkit-scrollbar-track { background: transparent; }
  #console-out::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 3px; }
  .log-line { padding: 1px 0; word-break: break-all; }
  .log-print  { color: var(--text); }
  .log-warn   { color: var(--warn); }
  .log-error  { color: var(--err); }
  .log-status { color: var(--accent); }
  #console-bar {
    display: flex; align-items: center; gap: 8px; padding: 6px 10px;
    background: var(--surface); border-top: 1px solid var(--border);
  }

  /* ── hub panel ── */
  #hub-panel { flex-direction: column; }
  #hub-search-bar {
    display: flex; gap: 8px; padding: 10px 12px;
    background: var(--surface); border-bottom: 1px solid var(--border);
  }
  #hub-search {
    flex: 1; background: var(--muted); border: 1px solid var(--border);
    border-radius: var(--radius); color: var(--text); padding: 5px 10px;
    font-size: 12px; outline: none;
  }
  #hub-search:focus { border-color: var(--accent); }
  #hub-list {
    flex: 1; overflow-y: auto; padding: 8px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 8px; align-content: start;
  }
  #hub-list::-webkit-scrollbar { width: 5px; }
  #hub-list::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 3px; }
  .hub-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 10px 12px;
    cursor: pointer; transition: border-color .15s, background .15s;
  }
  .hub-card:hover { border-color: var(--accent); background: rgba(124,106,247,.06); }
  .hub-card-name { font-weight: 600; font-size: 12.5px; margin-bottom: 4px; }
  .hub-card-meta { font-size: 11px; color: var(--text-dim); }
  .hub-card-actions { display: flex; gap: 6px; margin-top: 8px; }
  .hub-card-actions .btn { padding: 3px 10px; font-size: 11px; }

  /* ── settings panel ── */
  #settings-panel { padding: 20px; overflow-y: auto; }
  .setting-group { margin-bottom: 20px; }
  .setting-group h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--text-dim); margin-bottom: 10px; }
  .setting-row { display: flex; align-items: center; justify-content: space-between;
    padding: 8px 0; border-bottom: 1px solid var(--border); }
  .setting-row label { font-size: 12.5px; }
  .setting-row input[type=text] {
    background: var(--muted); border: 1px solid var(--border);
    border-radius: var(--radius); color: var(--text);
    padding: 4px 8px; font-size: 12px; outline: none; width: 200px;
  }
  .setting-row input[type=text]:focus { border-color: var(--accent); }
  toggle-switch { /* placeholder */ }

  /* ── inject button in sidebar ── */
  #inject-btn {
    margin: 10px; padding: 8px; border-radius: var(--radius);
    background: var(--accent); color: #fff; border: none;
    font-size: 12.5px; font-weight: 700; cursor: pointer;
    transition: opacity .15s;
  }
  #inject-btn:hover { opacity: .85; }
  #inject-btn:disabled { opacity: .4; cursor: not-allowed; }
</style>
</head>
<body>

<!-- titlebar -->
<div id="titlebar">
  <div class="left">
    <span class="title">Naiko</span>
    <span class="version">v1.0</span>
  </div>
  <div class="controls">
    <button class="ctrl-btn" onclick="naiko.windowMinimize()">─</button>
    <button class="ctrl-btn" onclick="naiko.windowMaximize()">□</button>
    <button class="ctrl-btn close" onclick="naiko.windowClose()">✕</button>
  </div>
</div>

<!-- status bar -->
<div id="statusbar">
  <div id="status-dot" class="disconnected"></div>
  <span id="status-text">disconnected</span>
  <span class="spacer"></span>
  <span id="roblox-ver"></span>
</div>

<!-- app -->
<div id="app">

  <!-- sidebar -->
  <div id="sidebar">
    <button id="inject-btn" onclick="handleInject()">⚡ Inject</button>

    <div class="nav-sep"></div>
    <div class="nav-item active" data-panel="editor">
      <span class="nav-icon">✏️</span> Editor
    </div>
    <div class="nav-item" data-panel="hub">
      <span class="nav-icon">📦</span> Script Hub
    </div>
    <div class="nav-item" data-panel="console">
      <span class="nav-icon">🖥️</span> Console
    </div>

    <div class="sidebar-bottom">
      <div class="nav-sep"></div>
      <div class="nav-item" data-panel="settings">
        <span class="nav-icon">⚙️</span> Settings
      </div>
    </div>
  </div>

  <!-- content -->
  <div id="content">

    <!-- editor -->
    <div id="editor-panel" class="panel active">
      <div style="display:flex;flex-direction:column;flex:1;overflow:hidden;">
        <div id="editor-wrap" style="flex:1;">
          <div id="monaco-container"></div>
        </div>
        <div id="editor-bar">
          <button class="btn btn-primary" onclick="executeScript()">▶ Execute</button>
          <button class="btn btn-ghost"   onclick="clearEditor()">Clear</button>
          <div class="editor-bar-right">
            <button class="btn btn-ghost" onclick="saveScript()">Save</button>
          </div>
        </div>
      </div>
    </div>

    <!-- hub -->
    <div id="hub-panel" class="panel">
      <div id="hub-search-bar">
        <input id="hub-search" type="text" placeholder="Search scripts..." oninput="filterHub()">
        <button class="btn btn-ghost" onclick="loadHub()">↻ Refresh</button>
      </div>
      <div id="hub-list"></div>
    </div>

    <!-- console -->
    <div id="console-panel" class="panel">
      <div id="console-out"></div>
      <div id="console-bar">
        <button class="btn btn-ghost" onclick="clearConsole()">Clear</button>
        <span id="log-count" style="color:var(--text-dim);font-size:11px;margin-left:auto;">0 lines</span>
      </div>
    </div>

    <!-- settings -->
    <div id="settings-panel" class="panel">
      <div class="setting-group">
        <h3>Executor</h3>
        <div class="setting-row">
          <label>Auto-inject on launch</label>
          <input type="text" value="off" style="width:60px;">
        </div>
        <div class="setting-row">
          <label>DLL path</label>
          <input type="text" id="dll-path" value="bin/NaikoCore.dll" style="width:240px;">
        </div>
      </div>
      <div class="setting-group">
        <h3>Editor</h3>
        <div class="setting-row">
          <label>Font size</label>
          <input type="text" id="font-size" value="13" style="width:60px;"
            onchange="editor && editor.updateOptions({fontSize: +this.value})">
        </div>
        <div class="setting-row">
          <label>Word wrap</label>
          <input type="text" id="word-wrap" value="off" style="width:60px;"
            onchange="editor && editor.updateOptions({wordWrap: this.value})">
        </div>
      </div>
      <div class="setting-group">
        <h3>About</h3>
        <div class="setting-row"><label>Version</label><span>1.0.0</span></div>
        <div class="setting-row"><label>Engine</label><span>Electron + Monaco</span></div>
      </div>
    </div>

  </div>
</div>

<!-- monaco loader -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
<script>
// ── monaco init ──────────────────────────────────────────
let editor = null;

require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' } });
require(['vs/editor/editor.main'], function() {
    monaco.editor.defineTheme('naiko', {
        base: 'vs-dark',
        inherit: true,
        rules: [
            { token: 'comment',   foreground: '4a4a60', fontStyle: 'italic' },
            { token: 'keyword',   foreground: '9d8fff' },
            { token: 'string',    foreground: '4ade80' },
            { token: 'number',    foreground: 'facc15' },
            { token: 'type',      foreground: '67e8f9' },
            { token: 'function',  foreground: 'c084fc' },
        ],
        colors: {
            'editor.background':           '#0d0d0f',
            'editor.foreground':           '#e2e2e8',
            'editorLineNumber.foreground': '#3b3b55',
            'editorCursor.foreground':     '#7c6af7',
            'editor.selectionBackground':  '#7c6af730',
            'editor.lineHighlightBackground': '#141417',
            'editorIndentGuide.background': '#1f1f25',
            'scrollbarSlider.background':  '#2a2a3280',
        }
    });

    editor = monaco.editor.create(document.getElementById('monaco-container'), {
        language:        'lua',
        theme:           'naiko',
        fontSize:         13,
        fontFamily:      "'Cascadia Code', 'Consolas', monospace",
        fontLigatures:    true,
        minimap:         { enabled: false },
        scrollBeyondLastLine: false,
        renderLineHighlight: 'line',
        lineNumbers:     'on',
        roundedSelection: true,
        automaticLayout:  true,
        padding:         { top: 10, bottom: 10 },
        value: `-- Naiko Executor
-- paste your script below and hit Execute

loadstring(game:HttpGet("https://naikoexploit.vercel.app/ForsakenPlus"))()
`,
    });

    // ctrl+enter to execute
    editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.Enter, executeScript);
});

// ── navigation ───────────────────────────────────────────
document.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', () => {
        const target = item.dataset.panel;
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        item.classList.add('active');
        document.getElementById(target + '-panel').classList.add('active');
        if (target === 'hub') loadHub();
    });
});

// ── status updates ───────────────────────────────────────
naiko.onStatus(s => {
    const dot  = document.getElementById('status-dot');
    const text = document.getElementById('status-text');
    dot.className  = s;
    text.textContent = s;
});

// ── console ──────────────────────────────────────────────
let logCount = 0;
naiko.onConsole(({ type, msg }) => {
    const out  = document.getElementById('console-out');
    const line = document.createElement('div');
    line.className = 'log-line log-' + (type || 'print');
    line.textContent = msg;
    out.appendChild(line);
    out.scrollTop = out.scrollHeight;
    document.getElementById('log-count').textContent = ++logCount + ' lines';
});

function clearConsole() {
    document.getElementById('console-out').innerHTML = '';
    logCount = 0;
    document.getElementById('log-count').textContent = '0 lines';
}

// ── execute ───────────────────────────────────────────────
function executeScript() {
    if (!editor) return;
    const script = editor.getValue().trim();
    if (!script) return;
    naiko.execute(script);
}

function clearEditor() {
    if (editor) editor.setValue('');
}

// ── inject ────────────────────────────────────────────────
function handleInject() {
    const btn = document.getElementById('inject-btn');
    btn.disabled = true;
    btn.textContent = '⏳ Injecting...';
    naiko.inject();
    setTimeout(() => {
        btn.disabled = false;
        btn.textContent = '⚡ Inject';
    }, 3000);
}

// ── script hub ───────────────────────────────────────────
let hubScripts = [];

async function loadHub() {
    hubScripts = await naiko.getScripts();
    renderHub(hubScripts);
}

function renderHub(scripts) {
    const list = document.getElementById('hub-list');
    if (scripts.length === 0) {
        list.innerHTML = '<div style="color:var(--text-dim);padding:20px;grid-column:1/-1;">No saved scripts. Save scripts from the editor to see them here.</div>';
        return;
    }
    list.innerHTML = '';
    scripts.forEach(s => {
        const card = document.createElement('div');
        card.className = 'hub-card';
        card.innerHTML = `
            <div class="hub-card-name">${s.name}</div>
            <div class="hub-card-meta">${s.content.split('\n').length} lines</div>
            <div class="hub-card-actions">
                <button class="btn btn-primary" onclick="loadScript(${JSON.stringify(s.content)})">Load</button>
                <button class="btn btn-ghost"   onclick="execScript(${JSON.stringify(s.content)})">Run</button>
                <button class="btn btn-danger"  onclick="deleteScript(${JSON.stringify(s.name)})">✕</button>
            </div>`;
        list.appendChild(card);
    });
}

function filterHub() {
    const q = document.getElementById('hub-search').value.toLowerCase();
    renderHub(hubScripts.filter(s => s.name.toLowerCase().includes(q)));
}

function loadScript(content) {
    if (editor) editor.setValue(content);
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelector('[data-panel="editor"]').classList.add('active');
    document.getElementById('editor-panel').classList.add('active');
}

function execScript(content) { naiko.execute(content); }

async function deleteScript(name) {
    naiko.deleteScript(name);
    await loadHub();
}

async function saveScript() {
    if (!editor) return;
    const name = prompt('Script name:');
    if (!name) return;
    naiko.saveScript(name, editor.getValue());
    await loadHub();
}

// ── load hub on start ────────────────────────────────────
loadHub();
</script>
</body>
</html>
